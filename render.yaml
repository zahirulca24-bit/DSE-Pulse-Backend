services:
  - type: web
    name: dse-pulse-backend
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: APP_NAME
        value: DSE Pulse Backend
      - key: APP_VERSION
        value: 0.1.0
      - key: APP_MODE
        value: demo
      - key: OHLC_STORAGE_PATH
        value: storage/dse_ohlc.csv
      - key: SCANNER_STORAGE_PATH
        value: storage/scanner_latest.json
      - key: GOOGLE_DRIVE_FOLDER_ID
        value: 1juyZSKZACHQfb9KE1Qd0lcQFHNLT_K6F
      - key: GOOGLE_DRIVE_MASTER_FILENAME
        value: DSE_OHLC_MASTER.csv
      - key: GOOGLE_DRIVE_SERVICE_ACCOUNT_JSON_B64
        sync: false
      - key: FRONTEND_ORIGIN
        sync: false
