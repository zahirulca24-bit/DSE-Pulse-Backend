name: Mypy Diagnostic

on:
  push:
    branches:
      - feat/google-drive-storage

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/google-drive-storage
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -r requirements-dev.txt
      - name: Capture Mypy output
        run: python -m mypy app > mypy-output.txt 2>&1 || true
      - name: Commit diagnostic output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mypy-output.txt
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore: capture Mypy diagnostics"
          git push origin HEAD:feat/google-drive-storage
