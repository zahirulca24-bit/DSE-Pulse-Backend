name: Ruff Diagnostic

on:
  push:
    branches:
      - feat/google-drive-storage

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -r requirements-dev.txt
      - name: Capture Ruff output
        run: python -m ruff check . > ruff-output.txt 2>&1 || true
      - uses: actions/upload-artifact@v4
        with:
          name: ruff-output
          path: ruff-output.txt
