[project]
name = "dse-pulse-backend"
version = "0.1.0"
description = "FastAPI backend for the DSE Pulse Bangladesh stock-market intelligence platform."
requires-python = ">=3.11,<3.14"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
exclude = [".venv"]
